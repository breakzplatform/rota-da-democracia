<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rota da Democracia — Open Graph</title>
  <style>
    :root {
      --paper: #f3f0e8;
      --paper-2: #fffdf8;
      --ink: #142026;
      --red: #fd0200;
      --field: #c80000;
      --blue: #0034d2;
      --yellow: #ffe403;
      --green: #02ab20;
      --font-display: "Arial Narrow", "Helvetica Neue Condensed", "Roboto Condensed", "Nimbus Sans Narrow", "Liberation Sans Narrow", sans-serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--field);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .sheet {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      background: var(--field);
    }

    .stripe {
      flex: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 32px;
      background: var(--ink);
      border-bottom: 4px solid var(--ink);
    }

    .stripe span:nth-child(1) { background: var(--blue); }
    .stripe span:nth-child(2) { background: var(--yellow); }
    .stripe span:nth-child(3) { background: var(--green); }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 26px 64px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      flex: none;
      width: 52px;
      height: 52px;
      display: block;
    }

    .name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      line-height: 0.88;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--paper);
    }

    h1 {
      margin-top: 22px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 156px;
      line-height: 0.82;
      letter-spacing: -0.028em;
      text-transform: uppercase;
      color: #fff;
    }

    h1 span { display: block; }

    h1 .accent { color: var(--yellow); }

    .secondary {
      margin-top: 22px;
      max-width: 1072px;
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -0.014em;
      color: var(--paper-2);
    }

    .footer {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      height: 82px;
      padding: 0 64px;
      background: var(--yellow);
      color: var(--ink);
      border-top: 4px solid var(--ink);
    }

    .affiliation {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.011em;
    }

    .url {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="body">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="10" fill="#f3f0e8"/>
          <path fill="#c80000" fill-rule="evenodd" d="M5 30h6.2l3.6-9.2c.5-1.2 1.6-2 2.9-2h12.6c1.3 0 2.4.8 2.9 2L37 30h6v7.2c0 .4-.4.8-.8.8h-5.4a4.6 4.6 0 0 1-9.1 0H20.3a4.6 4.6 0 0 1-9.1 0H5.8c-.4 0-.8-.4-.8-.8V30zm9.2 8.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zm19.2 0a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/>
          <path fill="#c80000" d="M28.2 2.2 32.8 7.4 44.6.4 47 3.8 33 14.2 25.4 5.8Z"/>
        </svg>
        <p class="name">Rota da<br>Democracia</p>
      </div>
      <h1>
        <span>Veja a melhor</span>
        <span class="accent">rota pra votar</span>
      </h1>
      <p class="secondary">Ônibus de graça, carona solidária e o caminho até o seu local de votação</p>
    </div>
    <footer class="footer">
      <p class="affiliation"></p>
      <p class="url">rotadademocracia.online</p>
    </footer>
  </div>
</body>
</html>
