<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Open Graph</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative; }
    body {
      background: #c80000;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: inset 0 0 0 18px #c80000, inset 0 0 0 22px #f3f0e8;
    }
    .bar { position: absolute; left: 22px; right: 22px; top: 22px; height: 14px; display: grid; grid-template-columns: repeat(4, 1fr); }
    .bar i { display: block; }
    .frame { padding: 78px 84px 64px; height: 630px; box-sizing: border-box; display: flex; flex-direction: column; }
    .eyebrow {
      display: flex; align-items: center; gap: 14px; margin: 0;
      color: #ffe403;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 14px; height: 14px; background: #ffe403; }
    h1 {
      margin: 28px 0 0;
      font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
      font-weight: 700; font-size: 132px; line-height: 0.82; letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    h1 span { display: block; }
    h1 .accent { color: #ffe403; }
    p { margin: 36px 0 0; max-width: 820px; font-size: 32px; line-height: 1.35; color: #ffffff; font-family: system-ui, sans-serif; }
    .mark { position: absolute; right: 86px; bottom: 72px; }
  </style>
</head>
<body>
  <div class="bar" aria-hidden="true"><i style="background:#0034d2"></i><i style="background:#ffe403"></i><i style="background:#fd0200"></i><i style="background:#02ab20"></i></div>
  <div class="frame">
    <p class="eyebrow">Domingo, 25 de outubro de 2026</p>
    <h1><span>Rota da</span><span class="accent">democracia</span></h1>
    <p>Ônibus de graça, carona solidária e transporte da Justiça Eleitoral para chegar ao seu local de votação no 2º turno, domingo, 25 de outubro.</p>
    <svg class="mark" width="92" height="92" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="10" fill="#ffe403"/>
      <path fill="#142026" fill-rule="evenodd" d="M5 30h6.2l3.6-9.2c.5-1.2 1.6-2 2.9-2h12.6c1.3 0 2.4.8 2.9 2L37 30h6v7.2c0 .4-.4.8-.8.8h-5.4a4.6 4.6 0 0 1-9.1 0H20.3a4.6 4.6 0 0 1-9.1 0H5.8c-.4 0-.8-.4-.8-.8V30zm9.2 8.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zm19.2 0a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/>
      <path fill="#142026" d="M28.2 2.2 32.8 7.4 44.6.4 47 3.8 33 14.2 25.4 5.8Z"/>
    </svg>
  </div>
</body>
</html>
